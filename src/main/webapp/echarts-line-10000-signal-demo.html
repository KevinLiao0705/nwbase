<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECharts 10,000 筆真實訊號折線圖</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe3ef;
      --accent: #0ea5e9;
      --accent2: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(14, 165, 233, 0.14), transparent 35%),
        radial-gradient(circle at 90% 10%, rgba(16, 185, 129, 0.12), transparent 40%),
        var(--bg);
    }

    .wrap {
      max-width: 1320px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.10);
      padding: 16px;
    }

    .head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0.02em;
    }

    .desc {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .tips {
      font-size: 0.84rem;
      color: var(--muted);
      background: #f8fafc;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .memo {
      margin: 10px 0 12px;
      padding: 10px 12px;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      background: #f8fafc;
      color: #334155;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-line;
    }

    button {
      border: 1px solid #bae6fd;
      background: #e0f2fe;
      color: #0c4a6e;
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: #bae6fd;
      transform: translateY(-1px);
    }

    #chart {
      width: 100%;
      height: 700px;
      border-radius: 12px;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      #chart { height: 530px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>10,000 筆多資料集訊號（0~30000 整數陣列）</h1>
      </div>
      <div class="actions">
        <button id="btnResetZoom" type="button">重置縮放</button>
      </div>
    </div>
    <div class="memo">infomation String 1
infomation string 2
infomation string3</div>
    <div id="chart"></div>
  </div>

  <script>
    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // 產生單一資料集：回傳 0~30000 的整數陣列
    function generateIntSignalArray(count, seed, profile) {
      const rand = mulberry32(seed);
      const data = new Array(count);

      let drift = 0;
      let pulse = 0;

      for (let i = 0; i < count; i++) {
        const longWave = profile.longAmp * Math.sin((2 * Math.PI * i) / profile.longPeriod + profile.longPhase);
        const midWave = profile.midAmp * Math.sin((2 * Math.PI * i) / profile.midPeriod + profile.midPhase);
        const shortWave = profile.shortAmp * Math.sin((2 * Math.PI * i) / profile.shortPeriod + profile.shortPhase);

        drift += (rand() - 0.5) * profile.driftStep;
        drift = clamp(drift, -profile.driftLimit, profile.driftLimit);

        if (rand() < profile.pulseChance) {
          pulse += (rand() < 0.5 ? -1 : 1) * (profile.pulseMin + rand() * profile.pulseRange);
        }
        pulse *= profile.pulseDecay;

        const noise = (rand() - 0.5) * profile.noiseAmp;
        const trend = (i / count) * profile.trendAmp;

        const y = clamp(
          profile.base + longWave + midWave + shortWave + drift + pulse + noise + trend,
          0,
          30000
        );

        data[i] = Math.round(y);
      }

      return data;
    }

    // 你要的資料結構：
    // datasetNames = ["dataSetName1", "dataSetName2", "dataSetName3"]
    // dataSets[datasetName] = 0~30000 的 int array
    function generateAllDataSets(count, seed) {
      const datasetNames = ["dataSetName1", "dataSetName2", "dataSetName3"];
      const dataSets = {};

      dataSets.dataSetName1 = generateIntSignalArray(count, seed + 11, {
        base: 12000,
        longAmp: 5200, longPeriod: 2100, longPhase: 0.2,
        midAmp: 2600, midPeriod: 380, midPhase: 1.0,
        shortAmp: 900, shortPeriod: 58, shortPhase: 1.4,
        driftStep: 16, driftLimit: 1600,
        pulseChance: 0.0024, pulseMin: 900, pulseRange: 2600, pulseDecay: 0.965,
        noiseAmp: 1200,
        trendAmp: 1800
      });

      dataSets.dataSetName2 = generateIntSignalArray(count, seed + 23, {
        base: 16000,
        longAmp: 4600, longPeriod: 1800, longPhase: 0.9,
        midAmp: 2200, midPeriod: 300, midPhase: 0.2,
        shortAmp: 700, shortPeriod: 45, shortPhase: 2.1,
        driftStep: 14, driftLimit: 1400,
        pulseChance: 0.0020, pulseMin: 700, pulseRange: 2200, pulseDecay: 0.97,
        noiseAmp: 1000,
        trendAmp: -1000
      });

      dataSets.dataSetName3 = generateIntSignalArray(count, seed + 37, {
        base: 9000,
        longAmp: 3800, longPeriod: 2400, longPhase: 1.5,
        midAmp: 3000, midPeriod: 420, midPhase: 0.6,
        shortAmp: 1100, shortPeriod: 62, shortPhase: 0.7,
        driftStep: 18, driftLimit: 1800,
        pulseChance: 0.0030, pulseMin: 1000, pulseRange: 3400, pulseDecay: 0.958,
        noiseAmp: 1300,
        trendAmp: 2600
      });

      return { datasetNames, dataSets };
    }

    function toPairs(intArray) {
      const pairs = new Array(intArray.length);
      for (let i = 0; i < intArray.length; i++) {
        pairs[i] = [i, intArray[i]];
      }
      return pairs;
    }

    const totalPoints = 10000;
    let currentSeed = Date.now() & 0xffffffff;

    // 時間起始偏移（秒），修改此值即可調整顯示的起始時間
    var TIME_OFFSET = (function() {
      var parts = '08:30:00'.split(':');
      return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
    })();

    const chart = echarts.init(document.getElementById('chart'));

    function buildOption(payload) {
      const datasetNames = payload.datasetNames;
      const dataSets = payload.dataSets;

      const colorMap = {
        dataSetName1: '#0ea5e9',
        dataSetName2: '#10b981',
        dataSetName3: '#f59e0b'
      };

      const series = datasetNames.map(function (name) {
        return {
          name: name,
          type: 'line',
          data: toPairs(dataSets[name]),
          showSymbol: false,
          symbol: 'none',
          hoverAnimation: false,
          emphasis: {
            disabled: true
          },
          blur: {
            lineStyle: {
              opacity: 1
            }
          },
          lineStyle: {
            width: 1.3,
            color: colorMap[name] || '#0ea5e9'
          }
        };
      });

      return {
        animation: false,
        backgroundColor: '#ffffff',
        legend: {
          top: 32,
          data: datasetNames
        },
        tooltip: {
          trigger: 'axis',
          transitionDuration: 0,
          axisPointer: { type: 'line', snap: true, animation: false },
          formatter: function (params) {
            function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
            function toHMS(sec) {
              sec = Math.round(sec);
              var h = Math.floor(sec / 3600);
              var m = Math.floor((sec % 3600) / 60);
              var s = sec % 60;
              return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
            }
            var xSec = Math.round(params[0].value[0]);
            var xVal = fmt(xSec) + ' s  (' + toHMS(xSec + TIME_OFFSET) + ')';
            var html = '<div style="font-weight:600;margin-bottom:4px">' + xVal + '</div>';
            params.forEach(function (p) {
              html += '<div style="display:flex;align-items:center;gap:6px">' +
                '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + p.color + '"></span>' +
                '<span style="flex:1">' + p.seriesName + '</span>' +
                '<span style="font-weight:700;margin-left:12px">' + fmt(p.value[1]) + '</span>' +
                '</div>';
            });
            return html;
          }
        },
        toolbox: {
          right: 8,
          top: 6,
          feature: {
            dataZoom: {},
            restore: {},
            saveAsImage: {}
          }
        },
        grid: {
          left: 56,
          right: 22,
          top: 68,
          bottom: 74
        },
        xAxis: {
          type: 'value',
          name: 'Index',
          min: 0,
          max: totalPoints - 1,
          axisLine: { lineStyle: { color: '#64748b' } },
          axisLabel: { color: '#334155' },
          splitLine: { lineStyle: { color: 'rgba(148, 163, 184, 0.18)' } }
        },
        yAxis: {
          type: 'value',
          name: 'Value',
          min: 0,
          max: 30000,
          axisLine: { lineStyle: { color: '#64748b' } },
          axisLabel: { color: '#334155' },
          splitLine: { lineStyle: { color: 'rgba(148, 163, 184, 0.18)' } }
        },
        dataZoom: [
          {
            type: 'inside',
            xAxisIndex: 0,
            filterMode: 'none',
            zoomOnMouseWheel: true,
            moveOnMouseMove: true,
            moveOnMouseWheel: false,
            preventDefaultMouseMove: false
          },
          {
            type: 'inside',
            yAxisIndex: 0,
            filterMode: 'none',
            zoomOnMouseWheel: 'shift',
            moveOnMouseMove: false,
            moveOnMouseWheel: false,
            preventDefaultMouseMove: false
          },
          {
            type: 'slider',
            xAxisIndex: 0,
            filterMode: 'none',
            bottom: 20,
            height: 24,
            moveHandleSize: 10,
            borderColor: '#cbd5e1',
            fillerColor: 'rgba(14, 165, 233, 0.20)',
            handleStyle: {
              color: '#0ea5e9',
              borderColor: '#0369a1'
            },
            moveHandleStyle: {
              color: '#0ea5e9',
              opacity: 0.6
            }
          },
          {
            type: 'slider',
            yAxisIndex: 0,
            filterMode: 'none',
            right: 2,
            top: 86,
            bottom: 70,
            width: 14,
            moveHandleSize: 10,
            borderColor: '#cbd5e1',
            fillerColor: 'rgba(16, 185, 129, 0.18)',
            handleStyle: {
              color: '#10b981',
              borderColor: '#047857'
            },
            moveHandleStyle: {
              color: '#10b981',
              opacity: 0.6
            }
          }
        ],
        series: series
      };
    }

    function render(seed) {
      const payload = generateAllDataSets(totalPoints, seed);
      chart.setOption(buildOption(payload), true);
    }

    document.getElementById('btnResetZoom').addEventListener('click', function () {
      const dz = (chart.getOption() && chart.getOption().dataZoom) ? chart.getOption().dataZoom : [];
      for (let i = 0; i < dz.length; i++) {
        chart.dispatchAction({
          type: 'dataZoom',
          dataZoomIndex: i,
          start: 0,
          end: 100
        });
      }
    });

    window.addEventListener('resize', function () {
      chart.resize();
    });

    render(currentSeed);
  </script>
</body>
</html>
